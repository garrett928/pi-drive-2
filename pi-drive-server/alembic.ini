# Alembic configuration for Pi Drive Server.
#
# The database URL is NOT hard-coded here. env.py resolves it from (in order):
#   1. the "sqlalchemy.url" main option, if set programmatically (tests do this);
#   2. the DATABASE_URL environment variable.
# Run with:  flask/alembic -> `alembic upgrade head`  (with DATABASE_URL set)

[alembic]
script_location = migrations
prepend_sys_path = .
# Use os.pathsep when splitting prepend_sys_path (silences the legacy-split warning).
path_separator = os
# Left blank on purpose — resolved in env.py (see above).
sqlalchemy.url =

# ── Logging ────────────────────────────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
