{# API-key login (§9.2). No user accounts — the one key guards the UI. #}
{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="card login-card">
  <h1>Log in</h1>
  <p class="muted">Enter the server API key to manage telemetry.</p>
  <form method="post" action="{{ url_for('web.login', next=request.args.get('next')) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="api_key">API key</label>
    <input type="password" id="api_key" name="api_key" autocomplete="current-password" autofocus required>
    <button type="submit" class="btn btn-primary">Log in</button>
  </form>
</div>
{% endblock %}
