# The Pi Drive Flask/gunicorn server.
#
# Health contract (§5.4 / §9): livenessProbe → /healthz (always-200, no DB),
# readinessProbe → /readyz (checks the DB; returns 503 when the DB is down so
# the pod is pulled from the Service until the DB recovers — without restarting).
#
# Migrations: the image migrates on boot under a Postgres advisory lock
# (RUN_MIGRATIONS=1 from the ConfigMap), which is safe for multiple replicas.
# To use the one-shot migration-job.yaml instead, set RUN_MIGRATIONS=0.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pidrive-server
  namespace: pi-drive
  labels:
    app.kubernetes.io/name: pidrive-server
    app.kubernetes.io/part-of: pi-drive
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pidrive-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pidrive-server
        app.kubernetes.io/part-of: pi-drive
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: server
          # Replace with your registry/tag (CI build.yml pushes this on tag).
          image: pidrive-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: pidrive-config
            - secretRef:
                name: pidrive-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # pg_restore spools a temp dump file
            capabilities:
              drop: ["ALL"]
