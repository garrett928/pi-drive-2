# EXAMPLE secret — DO NOT commit real values. Copy to secret.yaml, fill in real
# values, and apply that (secret.yaml is gitignored). For production prefer
# Sealed Secrets, External Secrets Operator, or your cloud's secret manager
# rather than a plain manifest.
#
# Generate strong values:
#   API_KEY:    openssl rand -hex 32
#   SECRET_KEY: openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: pidrive-secrets
  namespace: pi-drive
  labels:
    app.kubernetes.io/name: pidrive-server
    app.kubernetes.io/part-of: pi-drive
type: Opaque
stringData:
  # Full SQLAlchemy URL. Point at the in-cluster StatefulSet (below) or a
  # managed Postgres/Timescale. The password here must match POSTGRES_PASSWORD
  # in the StatefulSet (or your managed instance).
  DATABASE_URL: "postgresql+psycopg://pidrive:CHANGE_ME@pidrive-postgres:5432/pidrive"
  # Static key the Android app + UI authenticate with.
  API_KEY: "CHANGE_ME_LONG_RANDOM"
  # Flask session signing key (used for the optional UI login / CSRF).
  SECRET_KEY: "CHANGE_ME_DIFFERENT_LONG_RANDOM"
  # Password for the in-cluster Postgres StatefulSet (omit if using managed DB).
  POSTGRES_PASSWORD: "CHANGE_ME"
