# Grafana Alloy config for Kubernetes — tails the pidrive-server pods' logs via
# the Kubernetes API, parses the JSON, and forwards to Loki with a WAL.
# Same parsing/schema as deploy/observability/alloy-config.alloy (compose).
apiVersion: v1
kind: ConfigMap
metadata:
  name: pidrive-alloy
  namespace: pi-drive
  labels:
    app.kubernetes.io/name: pidrive-alloy
    app.kubernetes.io/part-of: pi-drive
data:
  config.alloy: |
    // Discover pidrive-server pods in this namespace.
    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "pidrive" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        regex         = "pi-drive"
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        regex         = "pidrive-server"
        action        = "keep"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pidrive.output
      forward_to = [loki.process.pidrive.receiver]
    }

    loki.process "pidrive" {
      forward_to = [loki.write.default.receiver]

      stage.json {
        expressions = {
          timestamp  = "timestamp",
          level      = "level",
          logger     = "logger",
          component  = "component",
          env        = "env",
          request_id = "request_id",
          vin        = "vin",
          device_id  = "device_id",
          endpoint   = "endpoint",
          status     = "status",
        }
      }
      stage.timestamp {
        source = "timestamp"
        format = "RFC3339"
      }
      stage.static_labels {
        values = { app = "pi-drive-server" }
      }
      stage.labels {
        values = { component = "", level = "", env = "" }
      }
      stage.structured_metadata {
        values = {
          request_id = "",
          vin        = "",
          device_id  = "",
          endpoint   = "",
          status     = "",
          logger     = "",
        }
      }
    }

    loki.write "default" {
      endpoint {
        url                = env("LOKI_URL")
        max_backoff_period = "5m"
      }
      wal {
        enabled         = true
        max_segment_age = "1h"
      }
    }
