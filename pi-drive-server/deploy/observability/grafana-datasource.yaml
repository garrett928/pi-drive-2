# Provisions Loki as Grafana's default datasource (bundled compose stack).
apiVersion: 1
datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      # Surface the structured metadata fields as derived fields for quick
      # pivoting (e.g. click a request_id to trace it).
      maxLines: 1000
