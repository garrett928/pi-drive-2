# Pi Drive Server — prod-like local stack.
#
#   docker compose up --build
#
# The server image (deploy/Dockerfile) runs Alembic migrations on boot (advisory-
# locked) and serves via gunicorn. Add the observability stack (Loki/Alloy/
# Grafana, Phase 8) with:  docker compose --profile observability up
services:

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: pidrive
      POSTGRES_PASSWORD: pidrive
      POSTGRES_DB: pidrive
    volumes:
      - timescale_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pidrive -d pidrive"]
      interval: 5s
      timeout: 5s
      retries: 10

  pidrive-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - .env
    environment:
      # Override the host-oriented DATABASE_URL from .env: inside the compose
      # network the database is reached by its service name, not localhost.
      DATABASE_URL: postgresql+psycopg://pidrive:pidrive@timescaledb:5432/pidrive
    ports:
      - "8080:8080"
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s
    restart: unless-stopped

  # ── Observability (Phase 8) — opt in with: --profile observability ────────────
  loki:
    image: grafana/loki:3.0.0
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"

  alloy:
    image: grafana/alloy:v1.2.0
    profiles: ["observability"]
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_wal:/var/lib/alloy/data
    environment:
      LOKI_URL: http://loki:3100/loki/api/v1/push
    ports:
      - "12345:12345"
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana-datasource.yaml:/etc/grafana/provisioning/datasources/loki.yaml:ro
    ports:
      - "3000:3000"
    depends_on:
      - loki

volumes:
  timescale_data:
  alloy_wal:
