# Pi Drive Flask server — lint + tests against a real TimescaleDB.
#
# Runs only when server files change. A Timescale service container backs the
# integration + ingest-contract tests, so "the API is called with real data and
# the response inspected" runs in CI exactly as it does locally.
name: Server Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - "pi-drive-server/**"
      - ".github/workflows/server-test.yml"
  pull_request:
    branches: [ main, develop ]
    paths:
      - "pi-drive-server/**"
      - ".github/workflows/server-test.yml"

defaults:
  run:
    working-directory: pi-drive-server

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check app deploy tests

  test:
    name: Pytest (real TimescaleDB)
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: pidrive
          POSTGRES_PASSWORD: pidrive
          POSTGRES_DB: pidrive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pidrive -d pidrive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Point the suite's conftest at the service container instead of
      # testcontainers (Docker-in-Docker isn't needed when a service is up).
      TEST_DATABASE_URL: postgresql+psycopg://pidrive:pidrive@localhost:5432/pidrive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pg16 client (for backup/restore tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16 || sudo apt-get install -y postgresql-client
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"
      - name: Run tests with coverage
        run: pytest -q --cov=app --cov-report=xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: pi-drive-server/coverage.xml
          if-no-files-found: ignore
