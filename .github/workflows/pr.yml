name: Pull Request Checks

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  # ── Lint ───────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        id: setup-java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant gradlew execute permission
        run: chmod +x pi-drive-android/gradlew

      - name: Run lint
        working-directory: pi-drive-android
        run: ./gradlew :shared:lintDebug :mobile:lintDebug -Dorg.gradle.java.home=$JAVA_HOME
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.path }}

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: '**/build/reports/lint-results-debug.html'
          retention-days: 7

  # ── Build verification ─────────────────────────────────────────────────────
  build-check:
    name: Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        id: setup-java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant gradlew execute permission
        run: chmod +x pi-drive-android/gradlew

      - name: Build debug APK
        working-directory: pi-drive-android
        run: ./gradlew :mobile:assembleDebug -Dorg.gradle.java.home=$JAVA_HOME
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.path }}

  # ── Unit tests ─────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        id: setup-java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant gradlew execute permission
        run: chmod +x pi-drive-android/gradlew

      - name: Run unit tests
        working-directory: pi-drive-android
        run: ./gradlew :shared:test :mobile:test -Dorg.gradle.java.home=$JAVA_HOME
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.path }}

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr-test-results
          path: '**/build/test-results/**/*.xml'
          retention-days: 7
